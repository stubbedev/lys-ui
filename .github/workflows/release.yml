# Tag-driven release of the demo binaries: goreleaser (config in
# .goreleaser.yml) builds lys-ui-bar, lys-ui-panel, and lys-ui-hello for
# linux/amd64 + arm64 with CGO disabled and attaches the archives to
# the GitHub release. Nix stays the primary build path - nix users
# build from the flake at the tag (flake.nix); these artifacts are for
# everyone else. Module consumers pin versions by the same tags via
# go.mod. Trigger: push a v* tag.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
