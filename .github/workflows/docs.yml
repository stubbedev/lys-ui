# The documentation site on GitHub Pages: VitePress over docs/, with a
# screenshot of every shadcn component taken fresh from the code on
# each push. The shots run the gallery's -shots mode on a private
# headless sway inside the flake's dev shell (just docshots), the same
# environment the CI headless gate uses, so the site never shows a
# stale widget.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Screenshot every component
        run: nix develop -c just docshots docs/public/components
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Install VitePress
        working-directory: docs
        run: npm ci
      - name: Build the site
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
