# lys-ui CI: the release gates plus the compositor-in-the-loop input
# suite. The headless tests are required here - LYS_TEST_HEADLESS=1 makes
# any skip a failure - so a change that breaks live input/protocol
# behavior breaks CI before it can break a real desktop.
#
# Everything runs in the flake's dev shell (nix/shell.nix, pinned by
# flake.lock - the same environment developers enter with
# `nix develop` or direnv): the Go toolchain, golangci-lint, just, and
# sway for the headless compositor. The whole job needs no display
# server and no GPU: sway runs on wlroots' headless backend with the
# software (pixman) renderer.
#
# Layout: `check` runs the full gate on every push; `lint` gives PRs a
# fast, dedicated formatting + linting evidence check. Benchmarks run
# with the gates and their numbers are uploaded as artifacts - trend
# tracking only, never a gate (shared runners are too noisy to gate
# on). Releases are separate: .github/workflows/release.yml, on v* tags.
name: ci

on:
  push:
  pull_request:

# Every job only reads the repository: checkout, the Nix fetches the
# token rate-limits, and artifact uploads (which use their own token).
permissions:
  contents: read

jobs:
  lint:
    # PR evidence: formatting + golangci-lint in one quick pass. The full
    # gate (tests, headless suite) runs in the check job; this exists so
    # formatting and lint findings surface as their own PR check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: formatting + golangci-lint
        run: nix develop -c just lint fmt-check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: formatting gate
        run: nix develop -c just fmt-check
      - name: Release gates (vet, lint, test, build)
        run: nix develop -c just check
      - name: Race detector gate
        run: nix develop -c just race
      - name: GPU renderer on lavapipe
        run: nix develop -c just gpu
      - name: Headless compositor input gate
        run: nix develop -c just headless
      - name: AT-SPI bridge (bus-level)
        run: nix develop -c just atspi
      - name: AT-SPI bridge against real at-spi2-core
        run: nix develop -c just atspi-verify
      # Benchmarks are tracked, not gated: the numbers land as workflow
      # artifacts so regressions can be compared run over run. Fixed
      # sizes and no time-dependent content keep them comparable.
      - name: Benchmarks (artifact, not a gate)
        run: nix develop -c just bench 2>&1 | tee bench.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: bench.txt

  # The Hyprland side of the compositor-in-the-loop gate (#66): the
  # same suite the check job's sway gate runs, against Hyprland in a
  # private NixOS VM (own kernel, own DRM node - aquamarine cannot
  # boot without a real one, and hosted runners have no GPU to lend).
  # A required gate since #118: it stayed green across local VM runs
  # and CI for a sustained window.
  hyprland:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Hyprland compositor-in-the-loop gate (private VM)
        run: nix build -L .#checks.x86_64-linux.lys-ui-hyprland-vm
